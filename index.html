<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WuzMap - Navigasi Pintar Responsif</title>
    
    <!-- Leaflet CSS & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-glass: rgba(255, 255, 255, 0.96);
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #10b981;
            --input-bg: #f8fafc;
        }

        body.dark-mode {
            --bg-glass: rgba(15, 23, 42, 0.96);
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --primary: #38bdf8;
            --primary-dark: #0284c7;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; }
        #map { height: 100vh; width: 100%; z-index: 1; }

        /* Carian Atas (Z-Index Paling Tinggi) */
        .top-search-wrapper {
            position: absolute; top: 12px; left: 12px; right: 12px;
            z-index: 3000; max-width: 480px; margin: 0 auto;
        }

        .search-box {
            display: flex; align-items: center; background: var(--bg-glass);
            backdrop-filter: blur(16px); padding: 6px 14px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); border: 1px solid var(--border-color);
        }

        .search-box input {
            flex: 1; padding: 10px; border: none; background: transparent;
            font-size: 15px; outline: none; color: var(--text-main); font-weight: 600;
        }

        /* Dropdown Hasil Carian */
        .search-results-dropdown {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            background: var(--bg-card); border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
            max-height: 280px; overflow-y: auto; z-index: 3001;
            border: 1px solid var(--border-color); display: none;
        }

        .search-item {
            padding: 12px 16px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: background 0.2s;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover, .search-item:active { background: var(--input-bg); }

        .search-item-info { display: flex; flex-direction: column; gap: 2px; max-width: 80%; }
        .search-item-title { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .search-item-sub { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-item-badge {
            background: rgba(2, 132, 199, 0.12); color: var(--primary);
            font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 20px; white-space: nowrap;
        }

        /* Bottom Sheet Navigasi yang Boleh Lipat/Sorok */
        .routing-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 2000;
            background: var(--bg-glass); backdrop-filter: blur(16px);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 12px 16px 20px; border-top: 1px solid var(--border-color);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 480px; margin: 0 auto;
        }

        /* Mod Dilipat/Minimized */
        .routing-sheet.minimized {
            transform: translateY(calc(100% - 48px));
        }

        .sheet-handle-bar {
            width: 100%; padding: 4px 0 10px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .sheet-handle {
            width: 42px; height: 5px; background: var(--border-color);
            border-radius: 10px; transition: background 0.2s;
        }
        .sheet-handle-bar:hover .sheet-handle { background: var(--primary); }

        .sheet-minimized-title {
            font-size: 12px; font-weight: 700; color: var(--primary);
            margin-top: 4px; display: none;
        }
        .routing-sheet.minimized .sheet-minimized-title { display: block; }

        .mode-selector { display: flex; gap: 8px; margin-bottom: 10px; }
        .mode-btn {
            flex: 1; padding: 8px; border: 1px solid var(--border-color); background: var(--bg-card);
            border-radius: 12px; cursor: pointer; font-size: 13px; color: var(--text-sub);
            display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600;
        }
        .mode-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .poi-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
        .poi-pill {
            padding: 6px 12px; background: var(--input-bg); border-radius: 20px; font-size: 12px;
            white-space: nowrap; cursor: pointer; color: var(--text-main); border: 1px solid var(--border-color); font-weight: 600;
        }
        .poi-pill:active { background: var(--primary); color: white; }

        .input-wrapper { position: relative; margin-bottom: 8px; }
        .input-group { display: flex; align-items: center; background: var(--input-bg); border-radius: 12px; padding: 2px 10px; }
        .input-group i { font-size: 13px; margin-right: 8px; }
        .dot-start { color: #10b981; }
        .dot-end { color: #ef4444; }

        .input-group input {
            width: 100%; padding: 8px 0; border: none; background: transparent;
            font-size: 13px; outline: none; color: var(--text-main); font-weight: 600;
        }

        .btn-primary {
            width: 100%; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px;
        }

        .btn-success {
            width: 100%; padding: 12px; background: var(--accent); color: white;
            border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
            cursor: pointer; margin-top: 8px; display: none; align-items: center; justify-content: center; gap: 8px;
        }

        /* Floating Controls yang Bergerak Mengikut Sheet */
        .floating-controls {
            position: absolute; right: 14px; bottom: 330px; z-index: 2000;
            display: flex; flex-direction: column; gap: 10px;
            transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ctrl-btn {
            background: var(--bg-glass); color: var(--text-main); border: 1px solid var(--border-color);
            border-radius: 50%; width: 46px; height: 46px; font-size: 17px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.18); display: flex; justify-content: center; align-items: center;
        }
        .ctrl-btn:active { transform: scale(0.92); }

        #route-info {
            display: none; margin-top: 8px; padding: 10px; background: var(--input-bg);
            border-radius: 12px; text-align: center; color: var(--primary); font-size: 13px; font-weight: 700;
        }
        #loader { display: none; text-align: center; margin-top: 8px; color: var(--primary); font-size: 12px; }

        /* Custom Popup Style */
        .leaflet-popup-content-wrapper { background: var(--bg-card); color: var(--text-main); border-radius: 16px; padding: 4px; }
        .popup-info { text-align: center; padding: 4px; }
        .popup-info h4 { margin: 2px 0 6px; font-size: 14px; color: var(--text-main); }
        .popup-info p { margin: 0 0 10px; font-size: 12px; color: var(--text-sub); }
        .popup-btn {
            padding: 8px 14px; background: var(--accent); color: white; border: none;
            border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%;
        }

        @media (min-width: 640px) {
            .routing-sheet {
                top: 75px; left: 16px; bottom: auto; right: auto; width: 360px;
                border-radius: 20px; border-top: 1px solid var(--border-color);
            }
            .routing-sheet.minimized { transform: none; }
            .floating-controls { bottom: 24px !important; }
            .sheet-handle-bar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Carian Utama Atas -->
    <div class="top-search-wrapper">
        <div class="search-box">
            <i class="fas fa-search" style="color: var(--text-sub);"></i>
            <input type="text" id="globalSearch" placeholder="Cari tempat, e.g. Petronas Rengit..." autocomplete="off">
            <i class="fas fa-times" id="clearSearch" style="cursor: pointer; color: var(--text-sub); display: none;"></i>
        </div>
        <div id="searchResults" class="search-results-dropdown"></div>
    </div>

    <!-- Peta Canvas -->
    <div id="map"></div>

    <!-- Floating Buttons Sisi Kanan (Bergerak bersama Panel) -->
    <div class="floating-controls" id="floatingControls">
        <button class="ctrl-btn" onclick="toggleDarkMode()" title="Mod Gelap/Terang"><i class="fas fa-moon" id="darkModeIcon"></i></button>
        <button class="ctrl-btn" onclick="toggle3DMode()" title="Pandangan Satelit/3D"><i class="fas fa-layer-group" id="icon3D"></i></button>
        <button class="ctrl-btn" onclick="locateUser()" title="Lokasi Saya"><i class="fas fa-crosshairs"></i></button>
    </div>

    <!-- Bottom Sheet Navigasi -->
    <div class="routing-sheet" id="routingSheet">
        <div class="sheet-handle-bar" onclick="toggleSheet()">
            <div class="sheet-handle"></div>
            <div class="sheet-minimized-title"><i class="fas fa-chevron-up"></i> Buka Panel Navigasi</div>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('driving', this)"><i class="fas fa-car"></i> Pandu</button>
            <button class="mode-btn" onclick="setMode('walking', this)"><i class="fas fa-walking"></i> Jalan</button>
            <button class="mode-btn" onclick="setMode('bike', this)"><i class="fas fa-bicycle"></i> Basikal</button>
        </div>

        <div class="poi-pills">
            <div class="poi-pill" onclick="quickSearchPOI('Petronas')"><i class="fas fa-gas-pump"></i> Petronas</div>
            <div class="poi-pill" onclick="quickSearchPOI('Restoran')"><i class="fas fa-utensils"></i> Makanan</div>
            <div class="poi-pill" onclick="quickSearchPOI('Hospital')"><i class="fas fa-hospital"></i> Hospital</div>
            <div class="poi-pill" onclick="quickSearchPOI('ATM')"><i class="fas fa-money-bill-wave"></i> ATM</div>
        </div>

        <div class="input-wrapper">
            <div class="input-group">
                <i class="fas fa-circle dot-start"></i>
                <input type="text" id="startInput" placeholder="Lokasi Mula..." autocomplete="off">
            </div>
            <div id="startSuggestions" class="search-results-dropdown"></div>
        </div>

        <div class="input-wrapper">
            <div class="input-group">
                <i class="fas fa-map-marker-alt dot-end"></i>
                <input type="text" id="endInput" placeholder="Pilih Destinasi..." autocomplete="off">
            </div>
            <div id="endSuggestions" class="search-results-dropdown"></div>
        </div>

        <button class="btn-primary" onclick="calculateRoute()">
            <i class="fas fa-route"></i> Dapatkan Laluan
        </button>

        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Memproses laluan optimum...</div>
        <div id="route-info"></div>

        <button id="startNavBtn" class="btn-success" onclick="startNavigation()">
            <i class="fas fa-location-arrow"></i> Mula Navigasi Live
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi Peta (Percuma, tanpa API Key)
        var map = L.map('map', { zoomControl: false }).setView([3.1390, 101.6869], 13);
        L.control.zoom({ position: 'topright' }).addTo(map);

        var lightTile = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
        var darkTile = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
        var satelliteTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Esri Satellite' });

        var currentTile = lightTile;
        currentTile.addTo(map);

        // Global Variables
        var startMarker, endMarker, viewMarker, routeLine;
        var startCoords = null, endCoords = null, currentPos = null;
        var currentMode = 'driving', isDarkMode = false, is3D = false;

        // Auto Detect GPS User Awal
        locateUser(false);

        // Ketinggian Dinamik Butang GPS
        function adjustFloatingControls() {
            if (window.innerWidth >= 640) return;
            var sheet = document.getElementById('routingSheet');
            var controls = document.getElementById('floatingControls');
            
            if (sheet.classList.contains('minimized')) {
                controls.style.bottom = '65px';
            } else {
                var sheetHeight = sheet.offsetHeight;
                controls.style.bottom = (sheetHeight + 15) + 'px';
            }
        }

        // Toggle Lipat / Buka Panel
        function toggleSheet() {
            var sheet = document.getElementById('routingSheet');
            sheet.classList.toggle('minimized');
            adjustFloatingControls();
        }

        // Kira Jarak Haversine (km)
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(1);
        }

        function debounce(func, delay = 300) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => { func.apply(this, args); }, delay);
            };
        }

        // Carian Photon API
        async function fetchSmartLocations(query, containerId, onSelect) {
            if (query.length < 2) {
                document.getElementById(containerId).style.display = 'none';
                return;
            }

            var apiUrl = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=6`;
            if (currentPos) {
                apiUrl += `&lat=${currentPos.lat}&lon=${currentPos.lon}`;
            }

            try {
                var res = await fetch(apiUrl);
                var data = await res.json();
                var container = document.getElementById(containerId);
                container.innerHTML = '';

                if (data.features.length > 0) {
                    data.features.forEach(feat => {
                        var props = feat.properties;
                        var name = props.name || props.street || 'Lokasi';
                        var locality = [props.city, props.state, props.country].filter(Boolean).join(', ');
                        var lon = feat.geometry.coordinates[0];
                        var lat = feat.geometry.coordinates[1];

                        var distBadge = '';
                        if (currentPos) {
                            var km = getDistanceKm(currentPos.lat, currentPos.lon, lat, lon);
                            distBadge = `<span class="search-item-badge">${km} km</span>`;
                        }

                        var item = document.createElement('div');
                        item.className = 'search-item';
                        item.innerHTML = `
                            <div class="search-item-info">
                                <div class="search-item-title">${name}</div>
                                <div class="search-item-sub">${locality || 'Malaysia'}</div>
                            </div>
                            ${distBadge}
                        `;
                        item.onclick = () => {
                            onSelect(name, lat, lon);
                            container.style.display = 'none';
                        };
                        container.appendChild(item);
                    });
                    container.style.display = 'block';
                }
            } catch (err) { console.error(err); }
        }

        // Carian Utama
        var globalInput = document.getElementById('globalSearch');
        globalInput.addEventListener('input', debounce((e) => {
            var val = e.target.value;
            document.getElementById('clearSearch').style.display = val ? 'block' : 'none';
            fetchSmartLocations(val, 'searchResults', (name, lat, lon) => {
                globalInput.value = name;
                focusLocationOnMap(name, lat, lon);
            });
        }));

        document.getElementById('clearSearch').onclick = () => {
            globalInput.value = '';
            document.getElementById('clearSearch').style.display = 'none';
            document.getElementById('searchResults').style.display = 'none';
            if (viewMarker) map.removeLayer(viewMarker);
        };

        function focusLocationOnMap(name, lat, lon) {
            if (viewMarker) map.removeLayer(viewMarker);
            map.flyTo([lat, lon], 16, { animate: true, duration: 1.2 });

            var distText = currentPos 
                ? `Jarak dari anda: <b>${getDistanceKm(currentPos.lat, currentPos.lon, lat, lon)} km</b>`
                : "Aktifkan GPS untuk info jarak";

            var popupContent = `
                <div class="popup-info">
                    <h4>${name}</h4>
                    <p>${distText}</p>
                    <button class="popup-btn" onclick="directNavigateTo('${name.replace(/'/g, "\\'")}', ${lat}, ${lon})">
                        <i class="fas fa-directions"></i> Pandu Ke Sini
                    </button>
                </div>
            `;
            viewMarker = L.marker([lat, lon]).addTo(map).bindPopup(popupContent).openPopup();
        }

        function directNavigateTo(name, lat, lon) {
            endCoords = { lat, lon };
            document.getElementById('endInput').value = name;
            
            if (currentPos && !startCoords) {
                startCoords = { lat: currentPos.lat, lon: currentPos.lon };
                document.getElementById('startInput').value = "Lokasi Saya (GPS)";
            }
            
            // Buka semula panel jika dilipat semasa klik laluan
            document.getElementById('routingSheet').classList.remove('minimized');
            adjustFloatingControls();
            calculateRoute();
        }

        function quickSearchPOI(keyword) {
            globalInput.value = keyword;
            document.getElementById('clearSearch').style.display = 'block';
            fetchSmartLocations(keyword, 'searchResults', (name, lat, lon) => {
                globalInput.value = name;
                focusLocationOnMap(name, lat, lon);
            });
        }

        document.getElementById('startInput').addEventListener('input', debounce((e) => {
            fetchSmartLocations(e.target.value, 'startSuggestions', (name, lat, lon) => {
                document.getElementById('startInput').value = name;
                startCoords = { lat, lon };
            });
        }));

        document.getElementById('endInput').addEventListener('input', debounce((e) => {
            fetchSmartLocations(e.target.value, 'endSuggestions', (name, lat, lon) => {
                document.getElementById('endInput').value = name;
                endCoords = { lat, lon };
            });
        }));

        function setMode(mode, el) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            if (startCoords && endCoords) calculateRoute();
        }

        async function calculateRoute() {
            if (!startCoords || !endCoords) {
                alert("Sila tetapkan Lokasi Mula dan Destinasi.");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('route-info').style.display = 'none';

            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            if (routeLine) map.removeLayer(routeLine);

            startMarker = L.marker([startCoords.lat, startCoords.lon]).addTo(map).bindPopup("Mula");
            endMarker = L.marker([endCoords.lat, endCoords.lon]).addTo(map).bindPopup("Destinasi");

            var osrmUrl = `https://router.project-osrm.org/route/v1/${currentMode}/${startCoords.lon},${startCoords.lat};${endCoords.lon},${endCoords.lat}?overview=full&geometries=geojson`;

            try {
                var res = await fetch(osrmUrl);
                var data = await res.json();

                if (data.code === 'Ok' && data.routes.length > 0) {
                    var route = data.routes[0];
                    var dist = (route.distance / 1000).toFixed(1);
                    var dur = Math.round(route.duration / 60);

                    document.getElementById('route-info').innerHTML = `Jarak: <b>${dist} km</b> | Masa: <b>~${dur} minit</b>`;
                    document.getElementById('route-info').style.display = 'block';
                    document.getElementById('startNavBtn').style.display = 'flex';

                    var coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
                    routeLine = L.polyline(coords, { color: 'var(--primary)', weight: 6, opacity: 0.9 }).addTo(map);
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                    
                    adjustFloatingControls();
                }
            } catch (err) {
                alert("Gagal mengira laluan.");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function startNavigation() {
            if (!navigator.geolocation) return;
            alert("Mod Navigasi Aktif! Peta akan mengikuti lokasi pergerakan anda.");
            navigator.geolocation.watchPosition((pos) => {
                var lat = pos.coords.latitude;
                var lon = pos.coords.longitude;
                currentPos = { lat, lon };
                if (startMarker) startMarker.setLatLng([lat, lon]);
                map.flyTo([lat, lon], 17);
            }, (err) => console.error(err), { enableHighAccuracy: true });
        }

        function locateUser(fly = true) {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition((pos) => {
                var lat = pos.coords.latitude;
                var lon = pos.coords.longitude;
                currentPos = { lat, lon };
                if (!startCoords) {
                    startCoords = { lat, lon };
                    document.getElementById('startInput').value = "Lokasi Saya (GPS)";
                }
                if (fly) {
                    map.flyTo([lat, lon], 15);
                    L.marker([lat, lon]).addTo(map).bindPopup("Anda di sini").openPopup();
                }
            });
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            document.getElementById('darkModeIcon').className = isDarkMode ? 'fas fa-sun' : 'fas fa-moon';
            if (!is3D) {
                map.removeLayer(currentTile);
                currentTile = isDarkMode ? darkTile : lightTile;
                currentTile.addTo(map);
            }
        }

        function toggle3DMode() {
            is3D = !is3D;
            document.getElementById('icon3D').style.color = is3D ? '#10b981' : 'inherit';
            map.removeLayer(currentTile);
            currentTile = is3D ? satelliteTile : (isDarkMode ? darkTile : lightTile);
            currentTile.addTo(map);
        }

        // Laraskan kedudukan butang pada kali pertama dibuka
        window.addEventListener('load', adjustFloatingControls);
        window.addEventListener('resize', adjustFloatingControls);

        // Tutup senarai cadangan jika tekan luar
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.top-search-wrapper') && !e.target.closest('.input-wrapper')) {
                document.querySelectorAll('.search-results-dropdown').forEach(el => el.style.display = 'none');
            }
        });
    </script>
</body>
</html>
